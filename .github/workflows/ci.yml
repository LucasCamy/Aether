name: Aether CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore Aether.slnx --locked-mode
      - name: Build
        run: dotnet build Aether.slnx -c Release --no-restore
      - name: Integration tests with local services
        shell: pwsh
        run: |
          ./scripts/Initialize-Local.ps1
          ./scripts/Test.ps1
      - name: Stop local services
        if: always()
        run: docker compose --env-file .env -f infra/compose.yaml down
